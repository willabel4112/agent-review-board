<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>review-board</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header id="topbar"><span id="title">review-board</span></header>
<main class="single">
  <div id="gswrap"><input id="gsq" placeholder="🔍 Search all boards… (2+ characters; includes archives)">
  <div id="gsres"></div></div>
  <div id="doclist">Loading…</div>
  <p class="hint">Register a document: <code>python3 boardctl.py register &lt;path.md&gt;</code>
     · See the README for the agent workflow</p>
</main>
<script>
const LBL = {open:"Pending", draft:"⚠ Drafts", answered:"Answered", resolved:"Resolved"};
const RLBL = {open:"", answered:"⏳ Awaiting approval", approved:"✓ Approved", rejected:"Changes requested · waiting for agent"};
const esc = (x) => String(x).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function mk(doc, sat) {
  const a = document.createElement("a");
  a.className = "doccard" + (sat ? " satcard" : "") + (doc.exists ? "" : " dead");
  a.href = "/d/" + encodeURIComponent(doc.id);
  const counts = Object.entries(doc.counts || {}).filter(([s]) => s !== "draft" || true);
  const chips = counts.map(([s,n])=>`<span class="chip s-${s}">${LBL[s]||s} ${n}</span>`).join(" ");
  const r = doc.round, rl = r ? RLBL[r.status] : "";
  const rc = rl ? `<span class="chip s-${r.status==="answered"?"open":"resolved"}">Round ${r.batch} ${rl}</span>` : "";
  const born = doc.born && doc.born.cid ? `<span class="hint">⤴ born from #${doc.born.cid.slice(2)}</span> ` : "";
  const q = doc.question ? `<div class="dcq">❓ ${esc(doc.question.length>80?doc.question.slice(0,80)+"…":doc.question)}</div>` : "";
  // v2.3: 值守 (谁在 wait) + 看过 n/N
  const c = doc.claim;
  const cl = c ? `<span class="claim ${c.alive?"alive":"dead"}" title="${esc(c.cwd||"")} · ${(c.sid||"").slice(0,8)}">${c.alive?"●":"○"} ${esc(c.name)}@${esc(c.host)}</span> ` : "";
  const dr = doc.draft ? `<span class="chip s-draft">✏️ Draft</span> ` : "";
  const cv = doc.coverage && doc.coverage.n_total
    ? `<span class="cov ${doc.coverage.n_seen>=doc.coverage.n_total?"all":""}">Read ${doc.coverage.n_seen}/${doc.coverage.n_total}</span> ` : "";
  a.innerHTML = `<div class="dcname">${sat?"↳ ":""}${doc.emoji?`<span class="dcemoji">${esc(doc.emoji)}</span>`:""}${esc(doc.title)}${doc.exists?"":' <span class="hint">⚠ Local file missing (boardctl unregister)</span>'}</div>
    <div class="dcpath">${esc(doc.path)}</div>${q}<div>${dr}${born}${cl}${cv}${rc}${chips||(rc||born?"":'<span class="hint">No comments</span>')}</div>`;
  return a;
}
function renderDocs(box, docs) {
  // 母卡下挂卫星 (registry parent — 板侧元数据); 母不在注册表的卫星按顶层显示
  const live = docs.filter(x=>!x.archived), dead = docs.filter(x=>x.archived);
  const kids = {};
  for (const doc of live)
    if (doc.parent && live.some(x=>x.id===doc.parent))
      (kids[doc.parent] = kids[doc.parent]||[]).push(doc);
  for (const doc of live) {
    if (doc.parent && live.some(x=>x.id===doc.parent)) continue;
    box.appendChild(mk(doc, false));
    const ks = kids[doc.id]||[];
    if (ks.length) {                       // v2.4 F12: 卫星默认折进母行
      const det = mkDetails("sats", "sat:"+doc.id, `↳ Child documents ${ks.length}`);
      for (const k of ks) det.appendChild(mk(k, true));
      box.appendChild(det);
    }
  }
  if (dead.length) {
    const det = document.createElement("details");
    det.innerHTML = `<summary class="hint">🗄 Archived: ${dead.length}</summary>`;
    for (const doc of dead) det.appendChild(mk(doc, false));
    box.appendChild(det);
  }
}
function lsGet(k,f){try{return localStorage.getItem(k)??f}catch(e){return f}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function mkDetails(cls, key, label) {      // 折叠态记 localStorage (v2.4 树)
  const det = document.createElement("details");
  det.className = cls;
  det.open = lsGet("rb.tree."+key, cls==="msec"?"1":"0") === "1";
  const sum = document.createElement("summary");
  sum.textContent = label;
  det.appendChild(sum);
  det.addEventListener("toggle", () => lsSet("rb.tree."+key, det.open?"1":"0"));
  return det;
}
fetch("/api/docs").then(r=>r.json()).then(d=>{
  const box = document.getElementById("doclist");
  if (d.host) document.getElementById("title").textContent = "review-board · " + d.host;
  box.innerHTML = "";
  if (!d.docs.length) { box.textContent = "No documents registered yet."; return; }
  const det = mkDetails("msec", "local", `Local · ${d.host||""} (${d.docs.filter(x=>!x.archived).length})`);
  renderDocs(det, d.docs);
  box.appendChild(det);
});
const gsq=document.getElementById("gsq"), gres=document.getElementById("gsres");
let gt=null;
gsq.oninput=()=>{clearTimeout(gt); gt=setTimeout(async()=>{
  const q=gsq.value.trim();
  if(q.replace(/\s+/g,"").length<2){gres.innerHTML="";return;}
  const KL={block:"Content",comment:"Comment",answer:"Answer",question:"❓"};
  try{
    const r=await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const hits=(await r.json()).hits||[];
    gres.innerHTML=hits.length?"":'<div class="hint">No results</div>';
    for(const h of hits){
      const a=document.createElement("a"); a.className="srow"; a.href=h.url;
      a.innerHTML=`<span class="chip s-draft">${KL[h.kind]||esc(h.kind)}</span>${h.archived?"🗄 ":""}<span class="sdoc"></span><span class="sex"></span>`;
      a.querySelector(".sdoc").textContent=(h.title||h.doc)+" ·";
      const ex=a.querySelector(".sex"), t=h.excerpt||"", i=t.toLowerCase().indexOf(q.toLowerCase());
      if(i>=0){ex.append(t.slice(0,i)); const m=document.createElement("mark"); m.textContent=t.slice(i,i+q.length); ex.append(m,t.slice(i+q.length));}
      else ex.textContent=t;
      gres.appendChild(a);
    }
  }catch(e){gres.innerHTML='<div class="hint">Search failed</div>';}
},300);};
</script>
</body>
</html>
