<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>review-board</title>
<link rel="stylesheet" href="/static/style.css">
<link id="fav" rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/static/marked.min.js"></script>
<script src="/static/mermaid.min.js"></script>
</head>
<body class="viewer">
<header id="topbar">
 <div class="titlebar">
  <a href="/" id="home" title="All documents">⌂</a>
  <span id="title"></span>
  <span id="born" class="hint" hidden></span>
  <span id="question" class="hint" hidden></span>
  <span id="archchip" class="hint" hidden>🗄 Archived</span>
  <span id="draftdocchip" class="chip s-draft" hidden>✏️ Draft</span>
  <span id="claimchip" class="claim none" hidden></span>
 </div>
 <div class="toolbar">
  <button id="tocToggle" class="ghost" aria-expanded="true" aria-controls="outline" title="Question branches and document outline">☰ Navigate</button>
  <button id="seenBtn" class="ghost" title="Mark as read">Mark as read</button>
  <button id="submitBtn" disabled>Submit batch</button>
  <span id="covchip" class="cov" hidden></span>
  <span id="views" hidden>
    <button id="viewDoc" class="seg on">Document</button><button id="viewDiff" class="seg">Changes</button>
  </span>
  <span id="counts"></span>
  <span id="draftchip" hidden></span>
  <button id="searchBtn" class="ghost" title="Search this document, including collapsed comments and linked answers">🔍</button>
  <button id="noteBtn" class="ghost" title="Private notes · excluded from submission and the agent queue">📝</button>
  <button id="metaBtn" class="ghost" title="Change emoji and frame color">⚙</button>
  <button id="sideToggle" class="ghost" title="Toggle comment sidebar">◫</button>
 </div>
</header>
<div id="roundbar" hidden></div>
<div id="searchbar" hidden><input id="sq" placeholder="Search this document… (2+ characters; includes comments and answers)"><div id="sres"></div></div>
<div id="metaedit" hidden>
  <label>emoji <input id="me_emoji" maxlength="4" placeholder="🧭"></label>
  <label>Frame <input id="me_color" type="color"></label>
  <button id="me_save">Save</button>
</div>
<main>
  <nav id="outline" aria-label="Document outline">
    <section id="exploreMap" aria-label="Exploration paths">
      <div class="outline-head"><strong>Explore</strong><button id="exploreAsk" class="ghost tiny" title="Start a new question about this document">＋ Ask</button></div>
      <div id="exploreTree"></div>
      <p id="exploreHint">Start with a question. Its branch will appear here.</p>
    </section>
    <div class="outline-head"><strong>Outline</strong><button id="expandSections" class="ghost tiny">Expand all</button></div>
    <div id="toc"></div>
  </nav>
  <article id="doc"></article>
  <div id="sideDrag" title="Drag to resize · double-click to reset"></div>
  <aside id="side">
    <div id="stage" hidden></div>
    <div id="tray" hidden>
      <h3>⚠ Unanchored <span class="hint">(the original block is missing; expand the comment to inspect it)</span></h3>
      <div id="traylist"></div>
    </div>
    <div id="chips">
      <button class="fchip" data-f="todo">Unresolved</button><button class="fchip" data-f="drafts">Drafts</button><button class="fchip" data-f="followups">Follow-up</button><button class="fchip" data-f="all">All</button><button class="fchip" data-f="resolved">Resolved</button>
    </div>
    <div id="docthreads"></div>
    <div id="threads"></div>
  </aside>
</main>
<div id="composer" hidden>
  <div id="cquote"></div>
  <textarea id="ctext" placeholder="Comment… (⌘/Ctrl+Enter saves a draft)"></textarea>
  <div class="crow">
    <button id="csave">Save draft</button>
    <button id="csend" class="ghost">Send now</button>
    <button id="cexplore" class="ghost">Send as exploration</button>
    <button id="ccancel" class="ghost">Cancel</button>
  </div>
</div>
<div id="selectionActions" hidden><button id="selbtn">💬 Comment</button><button id="exploreSelBtn">↗ Explore</button></div>
<div id="toast" hidden></div>
<div id="exploreShade" hidden></div>
<section id="exploreDrawer" role="dialog" aria-modal="true" aria-label="Exploration reader" hidden>
  <div class="explore-controls">
    <button id="exploreBack" class="ghost">← Back to source</button>
    <nav id="exploreTrail" aria-label="Current exploration path"></nav>
    <a id="exploreExternal" target="_blank" rel="noopener" title="Open in a new tab">↗ Open separately</a>
    <button id="exploreClose" class="ghost" aria-label="Close exploration and return to the source">×</button>
  </div>
  <div id="exploreFrames"></div>
</section>
<script src="/static/navigation.js"></script>
<script src="/static/explore.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
